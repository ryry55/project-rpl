# ---------------------------------------------------------------------------
# supervisord - penjaga empat proses di dalam satu container produksi.
#
# Kenapa supervisord, dan bukan `php-fpm -D && nginx -g 'daemon off;'`:
# dengan cara itu, bila php-fpm mati, nginx tetap hidup dan menjawab 502
# dengan tenang. Platform mengira layanan sehat, tidak ada yang me-restart,
# dan pengguna melihat halaman galat sampai seseorang menyadarinya.
# `stopasgroup`/`killasgroup` di bawah membuat kematian salah satu proses
# mematikan seluruh container - sehingga kegagalan terlihat sebagai kegagalan.
# ---------------------------------------------------------------------------

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Soket kendali untuk `supervisorctl`. Tanpa dua bagian ini supervisorctl
; menjawab "does not include supervisorctl section" - dan perintah pemulihan
; yang tertulis di 8_OPERATIONS_SOP.md ("restart antrean") tidak bisa dijalankan
; sama sekali. Soketnya di /run, bukan berkas, jadi tidak ikut terunggah.
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
priority=10
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Penjadwal Laravel - pengganti cron, yang tidak disediakan Render free.
;
; Kenapa proses tersendiri dan bukan `cron` di dalam container: `schedule:work`
; adalah proses panjang yang menunggu sampai menit berikutnya lalu menjalankan
; tugas yang jatuh tempo. Sebagai program supervisord, ia ikut di-restart bila
; mati - sedangkan entri crontab tidak memberi tahu siapa pun bahwa ia berhenti.
;
; `startsecs=10` memberi waktu `config:cache` dan koneksi database selesai
; sebelum supervisord menganggap proses ini gagal dan mengulanginya.
[program:penjadwal]
command=php /var/www/html/artisan schedule:work
priority=30
autostart=true
autorestart=true
startsecs=10
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Pekerja antrean (Fase 5.5) - pengirim email notifikasi.
;
; `QUEUE_CONNECTION=database` di produksi: tanpa proses ini, email masuk tabel
; `jobs` lalu diam di sana tanpa satu pun galat. Karena itu ia program
; supervisord, bukan `nohup` di entrypoint - bila mati, ia di-restart.
;
; `--max-time=3600` mendaur ulang proses tiap jam: pekerja PHP yang hidup
; berhari-hari menahan memori yang tidak pernah dilepas.
[program:antrean]
command=php /var/www/html/artisan queue:work --sleep=3 --max-time=3600
priority=40
autostart=true
autorestart=true
startsecs=10
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
