; ---------------------------------------------------------------------------
; PHP-FPM untuk produksi satu layanan.
;
; Berkas ini dimuat SETELAH `www.conf` bawaan image (awalan `zz-`), sehingga
; nilai di bawah menimpa nilai bawaan tanpa perlu menghapus berkas aslinya.
;
; Bedanya dengan bawaan: jumlah worker dibatasi. Render free hanya 512 MB;
; `pm.max_children = 8` cukup untuk satu kos (paling banyak 30 kamar) dan
; menutup satu permintaan yang menggantung dari menghabiskan seluruh jatah.
;
; Sengaja TIDAK ada blok `[global]` di sini: `[global]` sudah ada di
; `php-fpm.conf` bawaan, dan mendefinisikannya dua kali membuat nilai yang
; saling menimpa tanpa urutan yang jelas.
; ---------------------------------------------------------------------------

[www]
user = www-data
group = www-data

; Soket TCP, bukan unix socket: nginx dan php-fpm berjalan sebagai proses
; terpisah di container yang sama, dan TCP membuat `ss -ltn` bisa dipakai
; untuk memastikan FPM benar-benar mendengarkan.
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Tanpa ini, satu skrip yang menggantung menahan worker selamanya.
request_terminate_timeout = 120s

; Variabel lingkungan dari platform harus sampai ke PHP. Bawaan image
; mengosongkannya, sehingga DB_PASSWORD dan APP_KEY tidak akan terlihat.
clear_env = no

access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
