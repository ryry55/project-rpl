; ---------------------------------------------------------------------------
; OPcache untuk image PRODUKSI (FASE 0.5).
;
; Berkas ini sengaja terpisah dari `opcache.ini` yang dipakai image
; pengembangan. Alasannya satu, dan bukan soal selera:
;
;   `validate_timestamps = 0` berarti PHP TIDAK memeriksa apakah berkas .php
;   berubah sejak di-cache. Di produksi itu yang diinginkan - kode tidak
;   berubah selama container hidup, dan pemeriksaan stat pada setiap permintaan
;   hanya membuang waktu.
;
;   Tetapi bila nilai yang sama dipakai di image pengembangan, siapa pun yang
;   memasang bind mount `./api` ke container akan menyunting berkas dan melihat
;   perubahannya TIDAK berpengaruh - tanpa galat, tanpa petunjuk. Itu jenis
;   jebakan yang memakan satu jam sebelum orang menyadari penyebabnya.
;
; Karena itu image pengembangan memakai `opcache.ini` (validate_timestamps = 1)
; dan image produksi memakai berkas ini.
;
; Catatan penting soal deploy: dengan `validate_timestamps = 0`, kode baru TIDAK
; akan terpakai sampai container benar-benar diganti. Di Render itu berarti
; setiap deploy harus membuat container baru - yang memang selalu terjadi. Jangan
; pernah menyunting berkas di dalam container produksi dan berharap efeknya
; muncul; itu tidak akan terjadi.
; ---------------------------------------------------------------------------

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000

; Kode produksi tidak berubah selama container hidup.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
