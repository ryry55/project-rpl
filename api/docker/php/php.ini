; Zona waktu PHP harus sama dengan config/app.php, kalau tidak date() dan Carbon
; bisa berbeda satu hari — dan itu langsung merusak hari_terlambat pada R-03.
date.timezone = Asia/Jakarta

memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 8M

; Jangan pernah menampilkan error ke klien pada mode produksi demo.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
