; ---------------------------------------------------------------------------
; PHP-FPM untuk lingkungan demo.
;
; Dimuat SETELAH `www.conf` bawaan image (awalan `zz-`), jadi nilai di bawah
; menimpa bawaan tanpa menghapus berkas aslinya - pola yang sama dengan
; `docker/prod/php-fpm.conf`.
;
; Kenapa berkas ini ada: bawaan image adalah `pm.max_children = 5`, dan pada
; uji beban 22 November 2026 angka itu menjadi plafon yang terukur. 500
; permintaan x 94 ms / 5 worker = 9,4 detik antrean, sehingga p95 pada 50
; bersamaan melewati 1.000 ms meski aplikasinya tidak lambat (5 bersamaan:
; p95 128-161 ms). Nilai 8 di sini **menyamakan demo dengan profil produksi**
; (`docker/prod/php-fpm.conf`), bukan menaikkannya khusus agar uji lulus.
;
; Biaya memori tetap dijaga: 8 worker x ~40 MB = ~320 MB, masih di bawah batas
; aman laptop sidang yang juga menjalankan Chrome. Yang tidak dilakukan adalah
; menaikkan angka ini sampai 50 bersamaan "lulus" - beban itu sintetis untuk
; satu kos berisi paling banyak 30 kamar.
;
; Sengaja TIDAK ada blok `[global]` di sini: `[global]` sudah ada di
; `php-fpm.conf` bawaan, dan mendefinisikannya dua kali membuat nilai yang
; saling menimpa tanpa urutan yang jelas.
; ---------------------------------------------------------------------------

[www]
; `static`, bukan `dynamic`: worker demo dilahirkan saat container start, bukan
; saat permintaan menumpuk. Dengan `dynamic`, run uji beban PERTAMA sesudah
; restart menanggung waktu lahir worker - terukur p95 1510 ms pada 22 November,
; sedangkan dua run berikutnya 980 dan 704 ms. Demo sidang tidak boleh
; bergantung pada "sudah hangat atau belum".
pm = static
pm.max_children = 8
pm.max_requests = 500

; Tanpa ini, satu skrip yang menggantung menahan worker selamanya.
request_terminate_timeout = 120s
