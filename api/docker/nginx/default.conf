server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;

    # Semua permintaan masuk lewat front controller Laravel.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # FASE 0.1c - header proxy HARUS diteruskan ke PHP.
        #
        # `include fastcgi_params` hanya mengoper REMOTE_ADDR, tidak satu pun
        # header HTTP. Tanpa dua baris di bawah, nginx membuang X-Forwarded-For
        # yang sudah dikirim `web` sebelum sampai ke Laravel - sehingga
        # `trustProxies` di bootstrap/app.php tidak punya apa pun untuk
        # dipercaya, dan `$request->ip()` tetap mengembalikan IP proxy.
        #
        # Ini bukan teori: uji docs/uji/uji-proxy.mjs gagal 0/5 sebelum baris
        # ini ada, meski trustProxies sudah terpasang. Perbaikan A1 butuh
        # KEDUANYA, dan rencana awal hanya menyebut yang pertama.
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;

        include fastcgi_params;

        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr;
}
