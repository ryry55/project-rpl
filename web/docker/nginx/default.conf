server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 4 MB, bukan bawaan nginx 1 MB: unggahan gambar QRIS lewat layanan ini
    # sebelum diteruskan ke `api-web`, dan batas bawaan menolaknya lebih dulu
    # dengan 413 halaman HTML (C1).
    client_max_body_size 4m;

    # Header keamanan dasar. Diulang di setiap lokasi yang punya `add_header`
    # sendiri, karena nginx tidak mewariskannya - lihat komentar di
    # `location = /index.html`.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 512;

    # Aset ber-hash aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Service worker TIDAK BOLEH di-cache. Peramban memeriksa ulang berkas ini
    # pada setiap pemuatan halaman; bila disajikan dari cache, versi baru
    # aplikasi tidak akan pernah terpasang dan pengguna tetap memakai versi
    # lama tanpa cara memperbaikinya selain membersihkan data situs.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires off;
        try_files $uri =404;
    }

    # Manifest juga diperiksa ulang, tetapi boleh memakai salinan basi saat
    # offline - jadi `no-cache` (boleh disimpan, wajib divalidasi), bukan
    # `no-store`.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # index.html menyebut nama berkas ber-hash. Bila di-cache, deploy berikutnya
    # akan menyajikan HTML lama yang menunjuk berkas yang sudah tidak ada.
    #
    # Header keamanan DIULANG di sini. `add_header` nginx tidak diwarisi oleh
    # lokasi yang punya `add_header` sendiri, dan SPA sampai ke lokasi ini lewat
    # internal redirect `try_files` - jadi tanpa pengulangan ini, SETIAP halaman
    # aplikasi kehilangan ketiganya. Yang diulang hanya yang berlaku untuk
    # koneksi biasa: tidak ada HSTS karena tumpukan demo dilayani lewat http
    # di localhost, dan HSTS pada localhost akan mengunci peramban ke https
    # untuk semua port. Versi produksi (docker/prod/nginx.conf.template) yang
    # menambahkan HSTS dan CSP.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires off;
    }

    # API diteruskan ke Laravel, supaya browser hanya melihat satu origin.
    location /api/ {
        proxy_pass http://api-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Laporan pelanggaran CSP diteruskan ke Laravel, seperti /api/. Tanpa blok
    # ini, POST ke sini jatuh ke `location /` dan dijawab index.html - laporannya
    # hilang tanpa galat apa pun, dan uji luring tidak akan pernah tahu.
    location = /csp-laporan {
        proxy_pass http://api-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: rute apa pun dilayani index.html agar router Vue bekerja.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
