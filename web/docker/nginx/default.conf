server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 512;

    # Aset ber-hash aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker TIDAK BOLEH di-cache. Peramban memeriksa ulang berkas ini
    # pada setiap pemuatan halaman; bila disajikan dari cache, versi baru
    # aplikasi tidak akan pernah terpasang dan pengguna tetap memakai versi
    # lama tanpa cara memperbaikinya selain membersihkan data situs.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
        try_files $uri =404;
    }

    # Manifest juga diperiksa ulang, tetapi boleh memakai salinan basi saat
    # offline - jadi `no-cache` (boleh disimpan, wajib divalidasi), bukan
    # `no-store`.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # index.html menyebut nama berkas ber-hash. Bila di-cache, deploy berikutnya
    # akan menyajikan HTML lama yang menunjuk berkas yang sudah tidak ada.
    location = /index.html {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # API diteruskan ke Laravel, supaya browser hanya melihat satu origin.
    location /api/ {
        proxy_pass http://api-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA: rute apa pun dilayani index.html agar router Vue bekerja.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
