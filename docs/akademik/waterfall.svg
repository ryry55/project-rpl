      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="kepalaBalik" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="52" font-size="23" font-weight="700" fill="#0f172a">TAHAPAN MODEL WATERFALL</text>
  <text x="60" y="76" font-size="13" fill="#475569">Sistem Informasi Operasional Huni - Gambar II.1</text>
  <line x1="420" y1="206" x2="420" y2="256" stroke="#334155" stroke-width="1.8" marker-end="url(#kepala)"/>
  <line x1="420" y1="348" x2="420" y2="398" stroke="#334155" stroke-width="1.8" marker-end="url(#kepala)"/>
  <line x1="420" y1="490" x2="420" y2="540" stroke="#334155" stroke-width="1.8" marker-end="url(#kepala)"/>
  <line x1="420" y1="632" x2="420" y2="682" stroke="#334155" stroke-width="1.8" marker-end="url(#kepala)"/>
  <path d="M 190 288 H 144 V 184 H 184" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#kepalaBalik)"/>
  <path d="M 190 430 H 144 V 326 H 184" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#kepalaBalik)"/>
  <path d="M 190 572 H 144 V 468 H 184" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#kepalaBalik)"/>
  <path d="M 190 714 H 144 V 610 H 184" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#kepalaBalik)"/>
  <rect x="190" y="120" width="460" height="86" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="420" y="154" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">1. Analisis Kebutuhan</text><text x="420" y="180" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">kebutuhan fungsional, nonfungsional, aturan bisnis</text>
  <rect x="190" y="262" width="460" height="86" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="420" y="296" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">2. Desain Sistem</text><text x="420" y="322" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">skema basis data, UML, rancangan antarmuka</text>
  <rect x="190" y="404" width="460" height="86" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="420" y="438" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">3. Implementasi</text><text x="420" y="464" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">API Laravel, antarmuka Vue, basis data</text>
  <rect x="190" y="546" width="460" height="86" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="420" y="580" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">4. Pengujian</text><text x="420" y="606" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">tes unit, integrasi, peramban, aksesibilitas, beban</text>
  <rect x="190" y="688" width="460" height="86" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="420" y="722" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">5. Pemeliharaan</text><text x="420" y="748" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">perbaikan temuan dan amandemen aturan</text>
  <text x="500" y="868" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Garis putus-putus: kembali ke tahap sebelumnya bila ditemukan kesalahan pada tahap berikutnya.</text>
