<path d="M800.4 584 l-10 -5.5 l0 11 z" fill="#334155"/>
<text x="591.4" y="576" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">10. INSERT personal_access_tokens</text>
<line x1="382.4" y1="624" x2="231" y2="624" stroke="#334155" stroke-width="1.4" stroke-dasharray="5 4"/>
<path d="M231 624 l9 -5 M231 624 l9 5" fill="none" stroke="#334155" stroke-width="1.4"/>
<text x="306.7" y="602" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">11. TokenResource +</text>
<text x="306.7" y="616" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">profil</text>
<line x1="231" y1="664" x2="95" y2="664" stroke="#334155" stroke-width="1.4" stroke-dasharray="5 4"/>
<path d="M95 664 l9 -5 M95 664 l9 5" fill="none" stroke="#334155" stroke-width="1.4"/>
<text x="163" y="656" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">12. 200 + token</text>
<line x1="40" y1="744" x2="859" y2="744" stroke="#cbd5e1"/>
<text x="40" y="766" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">Percobaan yang gagal dihitung di cache, bukan di basis data. Waktu jawab disamakan antara "email tidak terdaftar" dan "sandi salah" supaya</text>
<text x="40" y="781" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">alamat email tidak bisa diperiksa keberadaannya.</text>
