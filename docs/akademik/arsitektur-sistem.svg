<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="kepala" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="52" font-size="24" font-weight="700" fill="#0f172a">ARSITEKTUR SISTEM</text>
  <text x="60" y="78" font-size="13" fill="#475569">Huni - dua lingkungan yang dijalankan: demo di laptop, produksi di Vercel + Supabase</text>
  <text x="60" y="108" font-size="13" fill="#475569">Satu origin pada keduanya: SPA dan API di host yang sama; basis data di balik TLS.</text>
  <rect x="40" y="150" width="470" height="340" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/><text x="56" y="174" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.4">LINGKUNGAN DEMO (satu laptop, Docker Compose)</text>
  <rect x="70" y="200" width="200" height="70" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/><text x="170" y="219" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Peramban</text><text x="170" y="240" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">SPA Vue 3</text>
  <rect x="300" y="200" width="180" height="70" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/><text x="390" y="219" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">web (nginx)</text><text x="390" y="240" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">SPA + proxy /api</text>
  <rect x="300" y="300" width="180" height="70" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/><text x="390" y="319" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">api (PHP-FPM)</text><text x="390" y="340" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Laravel 12</text>
  <rect x="300" y="400" width="180" height="70" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/><text x="390" y="419" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">db</text><text x="390" y="440" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">PostgreSQL 16</text>
  <rect x="70" y="300" width="200" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="170" y="319" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Mailpit</text><text x="170" y="340" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">penangkap surel</text>
  <rect x="570" y="150" width="490" height="340" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/><text x="586" y="174" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.4">PRODUKSI (Vercel + Supabase)</text>
  <rect x="600" y="200" width="200" height="70" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/><text x="700" y="219" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Peramban / PWA</text><text x="700" y="240" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">HTTPS satu origin</text>
  <rect x="830" y="200" width="200" height="70" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/><text x="930" y="219" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Container Vercel</text><text x="930" y="240" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">nginx + PHP-FPM + SPA</text>
  <rect x="830" y="320" width="200" height="70" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/><text x="930" y="339" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Supabase</text><text x="930" y="360" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">PostgreSQL 17 (TLS)</text>
  <line x1="270" y1="235" x2="296" y2="235" stroke="#334155" stroke-width="1.5" marker-end="url(#kepala)"/><text x="283" y="227" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">HTTP</text>
  <line x1="390" y1="270" x2="390" y2="296" stroke="#334155" stroke-width="1.5" marker-end="url(#kepala)"/><text x="398" y="287" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="start">/api</text>
  <line x1="390" y1="370" x2="390" y2="396" stroke="#334155" stroke-width="1.5" marker-end="url(#kepala)"/><text x="398" y="387" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="start">SQL</text>
  <line x1="296" y1="335" x2="274" y2="335" stroke="#334155" stroke-width="1.5" marker-end="url(#kepala)"/><text x="285" y="327" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">SMTP</text>
  <line x1="800" y1="235" x2="826" y2="235" stroke="#334155" stroke-width="1.5" marker-end="url(#kepala)"/><text x="813" y="227" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">HTTPS</text>
  <line x1="930" y1="270" x2="930" y2="316" stroke="#334155" stroke-width="1.5" marker-end="url(#kepala)"/><text x="938" y="297" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="start">TLS</text>
  <rect x="70" y="530" width="990" height="78" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/><text x="84" y="554" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">Batas kepercayaan: di demo, hanya port 127.0.0.1 yang dibuka ke host. Di produksi, seluruh trafik masuk lewat</text><text x="84" y="571" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">HTTPS Vercel; basis data hanya menerima koneksi TLS dari container aplikasi (sslmode=require).</text>
  <rect x="70" y="630" width="990" height="60" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/><text x="84" y="654" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">Satu origin pada kedua lingkungan: SPA dan API dilayani dari host yang sama, sehingga tidak ada CORS dan token</text><text x="84" y="671" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">sesi tidak menyeberang situs.</text>
</svg>
