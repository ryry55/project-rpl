<text x="40" y="846" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">Tagihan orang lain dijawab 404, bukan 403 - 403 akan memberi tahu bahwa tagihan itu ada (R-07). Tautan yang masih menunggu dipakai ulang: dua klik tidak membuat dua tautan untuk tagihan yang sama. Nominal</text>
