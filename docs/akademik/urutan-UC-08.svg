<text x="40" y="886" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">Pencatatan manual (POST /tagihan/{id}/bayar) memakai PencatatPembayaran yang sama - satu aturan untuk semua jalur uang. Nominal notifikasi harus sama persis dengan yang dibekukan saat tautan dibuat (K-20): membayar</text>
