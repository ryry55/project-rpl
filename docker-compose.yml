# ---------------------------------------------------------------------------
# Sistem Informasi Operasional Kos-Kosan — lingkungan demo
#
# Tiga layanan: db (PostgreSQL), api (Laravel), web (nginx + SPA Vue).
# `docker compose up --build` dari keadaan bersih harus langsung jalan tanpa
# langkah manual — itu kriteria penerimaan T1.
# ---------------------------------------------------------------------------

name: kos-kosan

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kos}
      POSTGRES_USER: ${DB_USERNAME:-kos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kos}
      # Zona waktu database disamakan dengan aplikasi, supaya NOW() dan
      # perbandingan tanggal tidak berbeda sehari.
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-kos} -d ${DB_DATABASE:-kos}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    # Nama image ditulis eksplisit, bukan dibiarkan memakai nama bawaan
    # (kos-kosan-api) yang bergantung pada nama proyek compose. Alasannya ada di
    # CI: runner tidak menyimpan layer di antara dua job, jadi satu-satunya cara
    # cache build terpakai adalah bila tag yang dibangun di luar compose persis
    # sama dengan yang dipakai compose saat `up`. Nama bawaan berubah bila
    # seseorang mengganti `name:` di atas, dan cache-nya diam-diam berhenti
    # bekerja.
    image: kos-kosan/api:dev
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      APP_NAME: "Kos-Kosan"
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      # APP_KEY sengaja TIDAK dioper dari sini. Variabel environment kosong akan
      # menimpa isi .env, dan Laravel lalu menganggap kuncinya tidak diset.
      # Entrypoint yang membuatkan kunci ke dalam .env bila masih kosong.
      APP_URL: ${APP_URL:-http://localhost:8081}
      APP_TIMEZONE: Asia/Jakarta
      APP_DEMO_MODE: ${APP_DEMO_MODE:-true}
      APP_LOCALE: id
      APP_FALLBACK_LOCALE: id
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-kos}
      DB_USERNAME: ${DB_USERNAME:-kos}
      DB_PASSWORD: ${DB_PASSWORD:-kos}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      # Surat keluar ditangkap Mailpit, bukan dikirim ke alamat sungguhan.
      # Sejak T25 aplikasi benar-benar mengirim email, dan mengirimnya ke
      # penghuni demo yang alamatnya karangan berarti setiap simpan tarif
      # menghasilkan bouncing message. Mailpit menangkap semuanya dan
      # menampilkannya di http://localhost:8025 - cukup untuk membuktikan
      # emailnya tersusun benar tanpa menyentuh kotak masuk siapa pun.
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-kos@contoh.test}
      MAIL_FROM_NAME: "Kos-Kosan"
      RUN_MIGRATIONS: "true"
      RUN_SEEDER: "true"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  # Penangkap email untuk demo dan pengujian manual. Bukan bagian dari
  # aplikasi: mematikannya tidak mengubah perilaku apa pun selain email tidak
  # terkirim, dan itu memang sudah ditangani (Pemberitahu mencatat kegagalan
  # email ke log, tidak melemparnya ulang).
  mailpit:
    image: axllent/mailpit:v1.20
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      TZ: Asia/Jakarta
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  api-web:
    image: nginx:1.27-alpine
    volumes:
      # Hanya direktori public yang dipasang. Kode PHP tetap berasal dari image
      # `api`, supaya container benar-benar menjalankan apa yang dibangun —
      # kalau seluruh ./api dipasang, image menjadi tidak bermakna dan versi
      # dependensi di host bisa berbeda dari yang diuji.
      - ./api/public:/var/www/html/public:ro
      - ./api/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${API_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  web:
    image: kos-kosan/web:dev
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api-web
    restart: unless-stopped

volumes:
  db-data:
